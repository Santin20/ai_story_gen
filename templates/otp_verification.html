<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <link rel="stylesheet" href="{{url_for('static',filename='css/otp.css')}}">
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
<div class="otp-box">

    <h1>Verify OTP</h1>

    <p>
        We've sent a verification code to your email.(May be at Spam)
    </p>

    <form action="/verify_otp" method="POST">

        <div class="input-box">
            <label>Enter OTP </label>
            <input
                type="text"
                name="otp"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                required>
        </div>

        <button type="submit">
            VERIFY OTP
        </button>

    </form>

    <div class="bottom">

    </div>

</div>

</body>
</html>
